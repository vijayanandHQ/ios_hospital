name: Flutter iOS Build (Simulator)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Simulator App
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Build iOS (Simulator)
        # Generates a build specifically for iOS simulators instead of physical devices
        run: flutter build ios --simulator

      - name: 🗜️ Compress iOS build
        # The path changes to iphonesimulator instead of iphoneos
        run: tar -czf ios-build.tar.gz build/ios/iphonesimulator/Runner.app

      - name: 📤 Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avoota-ios-simulator-app
          path: ios-build.tar.gz
